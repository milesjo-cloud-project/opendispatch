services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      args:
        WITH_SHEETS: "true"  # this machine runs the waitlist; see api/requirements-sheets.txt
    env_file: .env
    environment:
      UPLOAD_DIR: /srv/uploads
      # Browsers reach the API through the web service's dev proxy, which adds their
      # address to X-Forwarded-For. Safe only while 8080 is bound to 127.0.0.1 below:
      # anyone who can call the API directly could put any address in that header.
      TRUSTED_PROXY_HOPS: "1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./api/app:/srv/app
      - ./api/migrations:/srv/migrations
      - uploads:/srv/uploads  # job documents; `down -v` wipes them with the database
      # Google service account key, if you use one. Read-only, and ./secrets is
      # gitignored. Point GOOGLE_SERVICE_ACCOUNT_FILE at /srv/secrets/<name>.json.
      - ./secrets:/srv/secrets:ro
    # Brings the schema up to date, then starts the API
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    depends_on:
      db:
        condition: service_healthy

  # Retries writes to outside services that failed: calendar events, and the launch
  # waitlist's copy in Google Sheets. So an event isn't lost because Google was down when
  # the dispatcher hit save. The API also drains the outboxes after each request that
  # queues one; this is what covers the rest of the time. One replica is enough.
  worker:
    build:
      context: ./api
      args:
        WITH_SHEETS: "true"
    env_file: .env
    volumes:
      - ./api/app:/srv/app
      - ./secrets:/srv/secrets:ro
    command: python -m app.outbox.worker
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: dev
    environment:
      VITE_API_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web/src:/srv/web/src
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
