# Weekly PRs for dependency updates; security fixes arrive as soon as they're published.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: [/infra/terraform/modules/app, /infra/terraform/envs/dev, /infra/terraform/envs/prod]
    schedule:
      interval: weekly
